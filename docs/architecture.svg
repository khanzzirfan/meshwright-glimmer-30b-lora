<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 350" role="img">
<title>Muse mesh track pipeline</title>
<desc>Three rows: CC0 kits become filtered text meshes; they are rendered, captioned by a Muse model, checked and built into a dataset; a Muse model is trained, exported, evaluated and written out as GLB.</desc>
<style>
.t{font:14px sans-serif;fill:#2c2c2a}.ts{font:12px sans-serif;fill:#5f5e5a}.th{font:500 14px sans-serif;fill:#2c2c2a}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="350" fill="#ffffff"/>

<g class="c-gray"><rect x="40" y="30" width="130" height="56" rx="8"/><text class="th" x="105" y="48" text-anchor="middle" dominant-baseline="central">CC0 kits</text><text class="ts" x="105" y="66" text-anchor="middle" dominant-baseline="central">565 GLB models</text></g>
<g class="c-gray"><rect x="196" y="30" width="130" height="56" rx="8"/><text class="th" x="261" y="48" text-anchor="middle" dominant-baseline="central">glb_to_text</text><text class="ts" x="261" y="66" text-anchor="middle" dominant-baseline="central">64-bin text</text></g>
<g class="c-gray"><rect x="352" y="30" width="130" height="56" rx="8"/><text class="th" x="417" y="48" text-anchor="middle" dominant-baseline="central">Filter + tags</text><text class="ts" x="417" y="66" text-anchor="middle" dominant-baseline="central">120 objects</text></g>
<g class="c-gray"><rect x="508" y="30" width="130" height="56" rx="8"/><text class="th" x="573" y="48" text-anchor="middle" dominant-baseline="central">objects.jsonl</text><text class="ts" x="573" y="66" text-anchor="middle" dominant-baseline="central">mesh text + name</text></g>
<line class="arr" x1="172" y1="58" x2="194" y2="58" marker-end="url(#arrow)"/>
<line class="arr" x1="328" y1="58" x2="350" y2="58" marker-end="url(#arrow)"/>
<line class="arr" x1="484" y1="58" x2="506" y2="58" marker-end="url(#arrow)"/>

<path class="arr" d="M573 86 L573 108 L105 108 L105 128" fill="none" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="40" y="130" width="130" height="56" rx="8"/><text class="th" x="105" y="148" text-anchor="middle" dominant-baseline="central">mesh_views</text><text class="ts" x="105" y="166" text-anchor="middle" dominant-baseline="central">4 renders each</text></g>
<g class="c-purple"><rect x="196" y="130" width="130" height="56" rx="8"/><text class="th" x="261" y="148" text-anchor="middle" dominant-baseline="central">Captioner</text><text class="ts" x="261" y="166" text-anchor="middle" dominant-baseline="central">Glimmer vision</text></g>
<g class="c-gray"><rect x="352" y="130" width="130" height="56" rx="8"/><text class="th" x="417" y="148" text-anchor="middle" dominant-baseline="central">Caption QA</text><text class="ts" x="417" y="166" text-anchor="middle" dominant-baseline="central">4 styles kept</text></g>
<g class="c-gray"><rect x="508" y="130" width="130" height="56" rx="8"/><text class="th" x="573" y="148" text-anchor="middle" dominant-baseline="central">Build dataset</text><text class="ts" x="573" y="166" text-anchor="middle" dominant-baseline="central">augment, split</text></g>
<line class="arr" x1="172" y1="158" x2="194" y2="158" marker-end="url(#arrow)"/>
<line class="arr" x1="328" y1="158" x2="350" y2="158" marker-end="url(#arrow)"/>
<line class="arr" x1="484" y1="158" x2="506" y2="158" marker-end="url(#arrow)"/>

<path class="arr" d="M573 186 L573 208 L105 208 L105 228" fill="none" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="40" y="230" width="130" height="56" rx="8"/><text class="th" x="105" y="248" text-anchor="middle" dominant-baseline="central">train_sft</text><text class="ts" x="105" y="266" text-anchor="middle" dominant-baseline="central">LoRA on Glimmer</text></g>
<g class="c-purple"><rect x="196" y="230" width="130" height="56" rx="8"/><text class="th" x="261" y="248" text-anchor="middle" dominant-baseline="central">Export</text><text class="ts" x="261" y="266" text-anchor="middle" dominant-baseline="central">GGUF + Ollama</text></g>
<g class="c-gray"><rect x="352" y="230" width="130" height="56" rx="8"/><text class="th" x="417" y="248" text-anchor="middle" dominant-baseline="central">Eval</text><text class="ts" x="417" y="266" text-anchor="middle" dominant-baseline="central">valid, fscore</text></g>
<g class="c-gray"><rect x="508" y="230" width="130" height="56" rx="8"/><text class="th" x="573" y="248" text-anchor="middle" dominant-baseline="central">GLB output</text><text class="ts" x="573" y="266" text-anchor="middle" dominant-baseline="central">into model3d</text></g>
<line class="arr" x1="172" y1="258" x2="194" y2="258" marker-end="url(#arrow)"/>
<line class="arr" x1="328" y1="258" x2="350" y2="258" marker-end="url(#arrow)"/>
<line class="arr" x1="484" y1="258" x2="506" y2="258" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="40" y="312" width="14" height="14" rx="3"/></g>
<text class="ts" x="62" y="320" dominant-baseline="central">Muse model does the work</text>
<g class="c-gray"><rect x="270" y="312" width="14" height="14" rx="3"/></g>
<text class="ts" x="292" y="320" dominant-baseline="central">Tooling and checks</text>
</svg>
